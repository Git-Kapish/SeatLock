events {
    worker_connections 8192;
}

http {
    include /etc/nginx/mime.types;
    default_type application/json;

    log_format main_json escape=json '{'
        '"time_local":"$time_local",'
        '"remote_addr":"$remote_addr",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"http_x_request_id":"$http_x_request_id"'
    '}';

    access_log /var/log/nginx/access.log main_json;
    error_log /var/log/nginx/error.log warn;

    # Rate limit by user token if authenticated, or by remote IP if anonymous
    map $http_authorization $rate_limit_key {
        default $http_authorization;
        ""      $binary_remote_addr;
    }

    # Coarse perimeter rate limit: 100 req/sec per user/IP
    limit_req_zone $rate_limit_key zone=api_rate_limit:20m rate=100r/s;

    server {
        listen 8000;
        listen [::]:8000;
        server_name localhost;

        resolver 127.0.0.11 valid=10s ipv6=off;
        set $auth_upstream http://auth-service:8001;
        set $events_upstream http://events-service:8002;
        set $booking_upstream http://booking-service:8003;

        # Coarse perimeter rate limit
        limit_req zone=api_rate_limit burst=100 nodelay;
        limit_req_status 429;

        # Generate request ID if missing from client
        set $req_id $http_x_request_id;
        if ($req_id = "") {
            set $req_id $request_id;
        }

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $req_id;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Auth Service Routes
        location /api/v1/auth/ {
            proxy_pass $auth_upstream;
        }

        # Events Service Routes
        location /api/v1/events {
            proxy_pass $events_upstream;
        }

        # Booking Service Routes
        location /api/v1/booking/ {
            proxy_pass $booking_upstream;
        }

        # Gateway Health Probe
        location /health/live {
            return 200 '{"status":"ok","gateway":"nginx"}';
            add_header Content-Type application/json;
        }
    }
}
