[project]
name = "ticketrush-notifier-worker"
version = "0.1.0"
description = "TicketRush Asynchronous SQS Notification Worker and Hold Sweeper"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ticketrush_common",
    "aiosmtplib>=3.0.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "greenlet>=3.0.0",
    "asyncpg>=0.29.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
