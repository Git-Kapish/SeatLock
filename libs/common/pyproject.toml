[project]
name = "ticketrush_common"
version = "0.1.0"
description = "Shared cross-cutting library for TicketRush microservices"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "pydantic[email]>=2.7.0",
    "email-validator>=2.1.0",
    "pydantic-settings>=2.2.0",
    "structlog>=24.1.0",
    "pyjwt>=2.8.0",
    "argon2-cffi>=23.1.0",
    "redis[hiredis]>=5.0.0",
    "prometheus-client>=0.20.0",
    "aioboto3>=13.0.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ticketrush_common"]
