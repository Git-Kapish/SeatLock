apiVersion: v1
kind: Service
metadata:
  name: gateway-nodeport
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: ticketrush
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: gateway
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080
      name: http
