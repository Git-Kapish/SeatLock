apiVersion: apps/v1
kind: Deployment
metadata:
  name: events-service
  labels:
    app.kubernetes.io/name: events-service
    app.kubernetes.io/part-of: ticketrush
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: events-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: events-service
        app.kubernetes.io/part-of: ticketrush
    spec:
      containers:
        - name: events-service
          image: ticketrush-events:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8002
              name: http
          envFrom:
            - configMapRef:
                name: ticketrush-config
            - secretRef:
                name: ticketrush-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: events-service
  labels:
    app.kubernetes.io/name: events-service
    app.kubernetes.io/part-of: ticketrush
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: events-service
  ports:
    - port: 8002
      targetPort: 8002
      name: http
