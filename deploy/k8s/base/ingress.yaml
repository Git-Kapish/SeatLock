apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ticketrush-ingress
  labels:
    app.kubernetes.io/part-of: ticketrush
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8000
